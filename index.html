<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Coin (GRC) - Instant Pay</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden mt-4 mb-8">
    
    <!-- Header -->
    <div class="bg-green-700 text-white p-5 text-center">
      <h1 class="text-2xl font-bold tracking-wide">🌿 Green Coin (GRC)</h1>
      <p class="text-green-100 text-xs mt-1">Ethereum Sepolia Instant Pay</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-200 bg-gray-50">
      <button id="tabCitizenBtn" onclick="showTab('citizen')" class="w-1/2 py-3 text-center font-semibold text-green-700 border-b-2 border-green-700 transition">
        👤 Πολίτης (Πληρωμή)
      </button>
      <button id="tabMerchantBtn" onclick="showTab('merchant')" class="w-1/2 py-3 text-center font-semibold text-gray-500 hover:text-green-700 transition">
        🏪 Έμπορος (Είσπραξη)
      </button>
    </div>

    <!-- TAB 1: ΠΟΛΙΤΗΣ -->
    <div id="tabCitizen" class="p-6 space-y-6">
      
      <!-- Balance -->
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
        <span class="text-xs text-green-800 uppercase font-semibold tracking-wider">Διαθέσιμο Υπόλοιπο</span>
        <div id="citizenBalance" class="text-3xl font-extrabold text-green-800 my-1">
          Φόρτωση...
        </div>
        <button onclick="refreshBalance()" class="text-xs text-green-600 hover:text-green-800 underline font-medium mt-1">
          🔄 Ανανέωση
        </button>
      </div>

      <!-- Payment Section -->
      <div class="space-y-4">
        
        <!-- Κουμπί Scanner & Preview -->
        <button id="btnScanQR" onclick="startCitizenScanner()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 transition">
          📷 Σκανάρισμα QR για Πληρωμή
        </button>
        
        <div id="reader" class="hidden w-full overflow-hidden rounded-xl border-2 border-blue-400"></div>

        <!-- Κάρτα Επιλεγμένου Εμπόρου (Εμφανίζεται ΜΟΝΟ μετά το σκανάρισμα) -->
        <div id="scannedMerchantCard" class="hidden bg-gray-50 border border-gray-200 rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <span class="text-xs font-bold text-gray-500 uppercase">Επιλεγμένος Έμπορος:</span>
            <span class="text-xs text-green-600 font-bold">✅ Έτοιμο</span>
          </div>
          <p id="displayMerchantAddress" class="text-xs font-mono text-gray-700 break-all"></p>
          
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Ποσό GRC προς Πληρωμή:</label>
            <input id="transferAmount" type="number" step="0.1" placeholder="π.χ. 2.5" class="w-full text-base font-bold p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
          </div>

          <button id="btnTransfer" onclick="sendTransfer()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition">
            💸 Ολοκλήρωση Πληρωμής
          </button>
        </div>

      </div>
    </div>

    <!-- TAB 2: ΕΜΠΟΡΟΣ -->
    <div id="tabMerchant" class="p-6 space-y-6 hidden">
      <div class="text-center space-y-3">
        <span class="text-xs text-gray-500 font-medium">QR Code Είσπραξης:</span>
        <div class="flex justify-center">
          <div id="merchantQrcode" class="p-3 bg-white rounded-xl border border-gray-200 shadow-md"></div>
        </div>
        <p class="text-xs text-gray-500 max-w-xs mx-auto">
          Δείξτε αυτόν τον κωδικό στον πολίτη για άμεση πληρωμή με GRC.
        </p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
