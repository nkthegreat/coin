name: Reward Citizen (Mint GRC)

on:
  workflow_dispatch:
    inputs:
      citizen:
        description: 'Citizen Wallet Address'
        required: true
        default: '0x2Cf9Ba822670EC6c4b2AA04D871ceB9026aa6EB3'
      amount:
        description: 'Amount of GRC'
        required: true
        default: '5'

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install ethers

      - name: Execute Minting
        env:
          ADMIN_PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY }}
          CITIZEN_ADDRESS: ${{ github.event.inputs.citizen }}
          AMOUNT: ${{ github.event.inputs.amount }}
        run: node mint.js
